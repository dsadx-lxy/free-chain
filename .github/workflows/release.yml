name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # 只匹配 v1.2.3 这种正式版本号

permissions:
  contents: write # 创建 Release 只需要这一项

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史和所有 tag 才能算出两个版本之间的提交

      - name: Generate release notes
        run: |
          prev=$(git tag --list --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vx "$GITHUB_REF_NAME" \
            | while read -r t; do
                if git merge-base --is-ancestor "$t" "$GITHUB_REF_NAME"; then echo "$t"; break; fi
              done)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          {
            echo "## 更新内容"
            echo
            git log "$range" --no-merges --format='- %s (%h, %an)'
            echo
            if [ -n "$prev" ]; then
              echo "完整对比：https://github.com/${{ github.repository }}/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
